[project]
name = "plasticity-placement"
version = "0.1.0"
description = "Controlled experiments for causal placement of agent memories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plasticity-pilot = "plasticity_placement.simulation.cli:main"
plasticity-train-lora = "plasticity_placement.training.cli:main"
plasticity-evaluate-lora = "plasticity_placement.evaluation.cli:main"
plasticity-p0c = "plasticity_placement.p0c.cli:main"
plasticity-p0d = "plasticity_placement.p0d.cli:main"
plasticity-p0d2 = "plasticity_placement.p0d2.cli:main"
plasticity-p0d2h = "plasticity_placement.p0d2h.cli:main"
plasticity-p0d2hc = "plasticity_placement.p0d2hc.cli:main"
plasticity-p0d2hfc = "plasticity_placement.p0d2hfc.cli:main"

[project.optional-dependencies]
train = [
    "accelerate>=1.2",
    "peft>=0.14",
    "safetensors>=0.4",
    "torch>=2.4",
    "transformers>=4.48,<6",
]
colab = [
    "bitsandbytes>=0.45; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plasticity_placement"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
