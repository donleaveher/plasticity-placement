claims:
  - id: "C0"
    status: "planned"
    text: "Endpoint-controlled fresh-session history families, paired access controls, and immutable lineage provide an auditable way to test behavioral equivalence of online memory updates."
  - id: "C1"
    status: "requires_new_result"
    text: "At least one named online-memory update operator exhibits a practically meaningful endpoint-consistency violation."
  - id: "C2"
    status: "requires_new_result"
    text: "Memory-operation features add held-out predictive value beyond pre-registered update-count, terminal-loss, gradient-cosine, optimizer-kernel, and Lie-bracket baselines."
  - id: "C3"
    status: "requires_new_result"
    text: "On a realistic repeated-update task, both an existing parametric/sequential updater and a textual-consolidation updater are audited, and at least one exposes a consequential failure missed by standard evaluation; a different model family supplies robustness."
  - id: "C4"
    status: "optional_requires_new_result"
    text: "Simple restore, refit, and modular baselines leave a deployment gap that warrants a new repair."
  - id: "C5"
    status: "optional_requires_new_result"
    text: "A contract-aware repair improves the consistency, accuracy, compute, storage, and rollback-latency frontier."
